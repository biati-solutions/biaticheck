name: Testseite auf GitHub Pages

# Baut die Testseite aus apps/testseite und legt sie als index.html auf den Branch "biati-main-test".
# GitHub Pages zeigt diesen Branch (Einstellungen → Pages → Branch: biati-main-test, Ordner: / (root)).
# Die Hauptseite (index.html) ist immer der neueste Stand. Gespeicherte Versionen liegen in eigenen Ordnern
# (z. B. BiatiCheck_v1/) und werden von diesem Ablauf nicht verändert.
on:
  push:
    branches: [main]
    paths:
      - "packages/pruefkern/**"
      - "packages/auslesen/**"
      - "apps/testseite/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-testseite
  cancel-in-progress: true

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Nur veröffentlichen, wenn die Tests bestehen
      - run: pnpm --filter @biaticheck/pruefkern --filter @biaticheck/auslesen test
      - run: pnpm testseite:bauen
      - name: Auf den Branch biati-main-test legen
        run: |
          set -e
          stand=$(git rev-parse --short HEAD)
          # Bestehenden Branch holen, damit gespeicherte Versionen (Ordner wie BiatiCheck_v1) erhalten bleiben
          ziel="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git clone -q --depth 1 --branch biati-main-test "$ziel" seite || { mkdir seite && git -C seite init -q -b biati-main-test; }
          cp apps/testseite/dist/biaticheck-test.html seite/index.html
          touch seite/.nojekyll
          cd seite
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Keine Änderung an der Testseite"; exit 0; }
          git commit -q -m "Testseite für GitHub Pages (Stand $stand)"
          git push -q "$ziel" biati-main-test
