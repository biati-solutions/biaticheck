name: Vorschau auf GitHub Pages

# Statische Vorschau: Startseite und Beispielergebnis mit der Musterabrechnung.
# GitHub Pages liefert nur fertige Dateien aus – die echte App (Upload, Datenbank, Prüfbereich)
# läuft auf einem eigenen Server, siehe docs/DEPLOYMENT.md.
#
# Einmalig einrichten: Repository → Settings → Pages → Source: „GitHub Actions“.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: biaticheck
          POSTGRES_PASSWORD: biaticheck
          POSTGRES_DB: biaticheck_vorschau
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U biaticheck" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://biaticheck:biaticheck@localhost:5432/biaticheck_vorschau
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Datenbank migrieren
        run: pnpm --filter @biaticheck/web db:migrate
      - name: Build
        run: pnpm --filter @biaticheck/web build
      - name: Browser installieren
        run: pnpm --filter @biaticheck/web exec playwright install --with-deps chromium
      - name: App im Demo-Modus starten
        working-directory: apps/web
        env:
          NODE_ENV: test
          ANTHROPIC_API_KEY: ""
          DEMO_AUSLESEN: "true"
          FREIGABE_ERFORDERLICH: "false"
          ZAHLUNG_MODUS: test
          UPLOADS_PRO_STUNDE: "100"
          UPLOAD_DIR: ./.daten/vorschau
        run: |
          export DATEI_SCHLUESSEL="$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")"
          nohup pnpm start -p 3300 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3300/ > /dev/null && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: Vorschau bauen
        run: VORSCHAU_URL=http://localhost:3300 pnpm --filter @biaticheck/web vorschau
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/vorschau

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
